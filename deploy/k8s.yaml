# drawDB Cloud — Kubernetes 部署示例(单用户)
#
# 使用前先创建密钥(不要把密码写进 git):
#   kubectl create secret generic drawdb-secrets \
#     --from-literal=AUTH_PASSWORD='<登录密码>' \
#     --from-literal=POSTGRES_PASSWORD='<数据库密码>' \
#     --from-literal=MCP_KEY=''            # 可选,留空表示不用 env 方式的 MCP Key
#
# 然后:kubectl apply -f deploy/k8s.yaml
# 按需修改镜像 tag、Ingress 域名与 TLS secret。
---
apiVersion: v1
kind: Service
metadata:
  name: drawdb-db
  labels: { app: drawdb-db }
spec:
  selector: { app: drawdb-db }
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: drawdb-db
spec:
  serviceName: drawdb-db
  replicas: 1
  selector:
    matchLabels: { app: drawdb-db }
  template:
    metadata:
      labels: { app: drawdb-db }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: drawdb
            - name: POSTGRES_DB
              value: drawdb
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: drawdb-secrets, key: POSTGRES_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "drawdb"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 1Gi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 5Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drawdb
  labels: { app: drawdb }
spec:
  replicas: 1
  selector:
    matchLabels: { app: drawdb }
  template:
    metadata:
      labels: { app: drawdb }
    spec:
      containers:
        - name: drawdb
          # 用你自己的镜像(GitHub Actions 在打 tag 时构建并推送)
          image: ghcr.io/zhu-jiyuan/drawdb-cloud:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: AUTH_PASSWORD
              valueFrom:
                secretKeyRef: { name: drawdb-secrets, key: AUTH_PASSWORD }
            - name: MCP_KEY
              valueFrom:
                secretKeyRef: { name: drawdb-secrets, key: MCP_KEY }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: drawdb-secrets, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: postgres://drawdb:$(POSTGRES_PASSWORD)@drawdb-db:5432/drawdb
            # ingress-nginx 会覆写 X-Forwarded-For 为真实客户端 IP,可安全开启
            - name: TRUST_PROXY
              value: "true"
          readinessProbe:
            httpGet: { path: /api/health, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3001 }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: drawdb
  labels: { app: drawdb }
spec:
  selector: { app: drawdb }
  ports:
    - port: 80
      targetPort: 3001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: drawdb
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
spec:
  ingressClassName: nginx
  rules:
    - host: drawdb.example.com # 改成你的域名
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: drawdb
                port: { number: 80 }
  tls:
    - hosts: [drawdb.example.com] # 改成你的域名
      secretName: drawdb-tls # 你的 TLS 证书 secret
