# drawDB cloud — single-user deployment.
# Namespace `default` on purpose: the mpga.me wildcard TLS secret lives there.
#
# Prerequisite (once, not in git):
#   kubectl create secret generic drawdb-secrets \
#     --from-literal=AUTH_PASSWORD='<login password>' \
#     --from-literal=POSTGRES_PASSWORD='<db password>'
---
apiVersion: v1
kind: Service
metadata:
  name: drawdb-db
  labels:
    app: drawdb-db
spec:
  selector:
    app: drawdb-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: drawdb-db
spec:
  serviceName: drawdb-db
  replicas: 1
  selector:
    matchLabels:
      app: drawdb-db
  template:
    metadata:
      labels:
        app: drawdb-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: drawdb
            - name: POSTGRES_DB
              value: drawdb
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: drawdb-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "drawdb"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drawdb
  labels:
    app: drawdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drawdb
  template:
    metadata:
      labels:
        app: drawdb
    spec:
      containers:
        - name: drawdb
          image: ghcr.io/zhu-jiyuan/drawdb-cloud:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: drawdb-secrets
                  key: AUTH_PASSWORD
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: drawdb-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://drawdb:$(POSTGRES_PASSWORD)@drawdb-db:5432/drawdb
            # ingress-nginx overwrites X-Forwarded-For with the real client IP
            # and sets X-Forwarded-Proto, so trusting the proxy is safe here
            # (rate limiting keys on true client IPs, cookies get Secure).
            - name: TRUST_PROXY
              value: "true"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: drawdb
  labels:
    app: drawdb
spec:
  selector:
    app: drawdb
  ports:
    - port: 80
      targetPort: 3001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: drawdb
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
spec:
  ingressClassName: nginx
  rules:
    - host: drawdb.mpga.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: drawdb
                port:
                  number: 80
  tls:
    - hosts:
        - drawdb.mpga.me
      secretName: mpga-wildcard-tls
