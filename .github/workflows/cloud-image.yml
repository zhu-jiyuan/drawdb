name: Cloud image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cloud-image
  cancel-in-progress: true

jobs:
  build:
    # Native arm64 runner (free for public repos) — the target cluster is
    # Oracle ARM, so no QEMU emulation is needed.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-cloud
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cloud
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Opens a PR against the GitOps repo bumping the pinned image tag; merging
  # it is what actually deploys (Argo CD auto-syncs k8s-deploy@master).
  gitops-pr:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zhu-jiyuan/k8s-deploy
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Bump drawdb image tag
        run: |
          TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          sed -i "s|image: ghcr.io/zhu-jiyuan/drawdb-cloud:.*|image: ghcr.io/zhu-jiyuan/drawdb-cloud:${TAG}|" \
            manifests/drawdb/app-deployment.yaml
          git diff --stat

      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
          branch: bump/drawdb
          base: master
          commit-message: "Bump drawdb to ${{ github.sha }}"
          title: "Bump drawdb image to sha-${{ github.sha }}"
          body: |
            Automated image bump from [zhu-jiyuan/drawdb@${{ github.sha }}](https://github.com/zhu-jiyuan/drawdb/commit/${{ github.sha }}).

            Merging this PR deploys it (Argo CD auto-sync).
