services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.cloud
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    ports:
      - "8080:3001"
    environment:
      DATABASE_URL: postgres://drawdb:${POSTGRES_PASSWORD:-drawdb}@db:5432/drawdb
      AUTH_PASSWORD: ${AUTH_PASSWORD:?set AUTH_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drawdb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drawdb}
      POSTGRES_DB: drawdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drawdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
